server {
    listen 8464 ssl;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/emssanareps.co.key;
    server_name sagas.emssanareps.co www.sagas.emssanareps.co;

    error_log /var/log/nginx/error.log error;
    access_log /var/log/nginx/access.log;

    # Reverse proxy hacia el microservicio en la red local interna
    # Elimina los problemas de CORS y Mixed Content (HTTPS -> HTTP)
    location /api/ {
        proxy_pass http://192.168.125.37:9163/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts extendidos para descargas de reportes masivos
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }
}
